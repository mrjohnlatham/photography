<style>

  ul{list-style:none;}

  /* transparent nav, floats directly over the hero image so it reaches full screen */

    position:fixed; top:0; left:0; right:0; z-index:70;
    height: var(--nav-h);
    padding-top: env(safe-area-inset-top, 0px);
    display:flex; align-items:center; justify-content:space-between;

  .brand{ font-size:22px; letter-spacing:.04em; font-weight:700; color:#fff; cursor:pointer; transition:color 300ms ease; }

  .nav-links{ display:flex; gap:22px; }

  .nav-links a::after{
    content:''; position:absolute; left:0; right:0; bottom:-2px; height:1px; background:#fff;
    transform:scaleX(0); transform-origin:left; transition:transform 340ms var(--ease), background 300ms ease;
  }
  .nav-links a:hover::after, .nav-links a.active::after{ transform:scaleX(1); }

  /* on the gallery page the nav switches to plain black */
  body.nav-black .brand,
  body.nav-black .nav-links a{ color:#0a0a0a; }

  .burger span:nth-child(2){ top:7px; }
  .burger span:nth-child(3){ top:14px; }
  .burger.open span:nth-child(1){ transform:translateY(7px) rotate(45deg); }
  .burger.open span:nth-child(2){ opacity:0; }
  .burger.open span:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }

  @media (max-width:780px){

   and automatically includes every image from every gallery as new ones are added */
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* home hero: only the curated home-selection images, shuffled within
   each category, then interleaved round-robin so the slideshow bounces
   category to category (music, weddings, portraits, music, weddings, ...).
   Each slide keeps a reference back to its category + item so a click can
   jump straight into that gallery at that image. */
function buildHeroImages(){
  const isMobile = window.innerWidth <= 780;
  const perCategory = categories.map(c =>
    shuffle(c.items.filter(it => it.img && it.home && !(isMobile && it.noMobile))).map(it => ({ img: it.img, slug: c.slug, id: it.id }))
  );
  const out = [];
  let i = 0;
  let remaining = perCategory.reduce((n, arr) => n + arr.length, 0);
  while (remaining > 0){
    for (const arr of perCategory){
      if (i < arr.length){
        out.push(arr[i]);
        remaining--;
      }
    }
    i++;
  }
  return out;
}

  /* Portraits: variety and balance - athlete/notable figures, creatives, groups, artistic shots */
  const portraitOrder = ['JOHNLATHAM-ANTHONYYARDE-3','JOHNLATHAM-DILLIANWHYTE-3','JOHNLATHAM-SABBC-2','JOHNLATHAM-SABBC-1','JOHNLATHAM-SABBC-3','JOHNLATHAM-CHARLIEEDWARDS-5','JOHNLATHAM-TERRYFLANNAGAN-3','JOHNLATHAM-SACRED-1','JOHNLATHAM-NEWGATEPORTRAITS-5','JOHNLATHAM-NEWGATEPORTRAITS-1','JOHNLATHAM-NEWGATEPORTRAITS-7','JOHNLATHAM-BRIGHTERWORLD-2','JOHNLATHAM-DAVIDA-1'];
  const portraitCat = categories.find(c=>c.slug==='portraits');
  if(portraitCat) {
    const idMap = {};
    portraitCat.items.forEach(item => idMap[item.id] = item);
    portraitCat.items = portraitOrder.map(id => idMap[id]).filter(Boolean);
  }
}
reorderGalleries();

/* build nav: gallery categories, then Contact */
const navD = document.getElementById('navLinksDesktop');
const navM = document.getElementById('navLinksMobile');

function addNavItem(label, onClick, slug, delayIndex){
  const li1=document.createElement('li'); const a1=document.createElement('a');
  a1.textContent=label; a1.href='javascript:void(0)'; if(slug) a1.dataset.slug=slug;
  a1.onclick=onClick; li1.appendChild(a1); navD.appendChild(li1);

  const li2=document.createElement('li'); const a2=document.createElement('a');
  a2.textContent=label; a2.href='javascript:void(0)';
  a2.style.transitionDelay=(delayIndex*40)+'ms'; a2.style.animationDelay=(delayIndex*40)+'ms';
  a2.onclick=onClick; li2.appendChild(a2); navM.appendChild(li2);
}

categories.forEach((c,i)=> addNavItem(c.label, ()=>openGallery(c.slug), c.slug, i));
addNavItem('Contact', ()=>openContact(), 'contact', categories.length);

/* mobile menu */
const burger = document.getElementById('burger');
const mobileOverlay = document.getElementById('mobileOverlay');
let mobileOpen=false;
function toggleMobile(force){
  mobileOpen = force!==undefined ? force : !mobileOpen;
  burger.classList.toggle('open', mobileOpen);
  mobileOverlay.classList.toggle('open', mobileOpen);
}

/* hero crossfade across all supplied images, 3s per slide */
const homeSection = document.getElementById('home');
const slideA = homeSection.querySelector('[data-slide="0"]');
const slideB = homeSection.querySelector('[data-slide="1"]');
let heroIdx = 0;
let showingA = true;
/* on mobile, a couple of hero shots need reframing so the subject
   isn't cropped out by the narrower portrait viewport */
const mobilePositionOverrides = {
  "images/Cabbage-3.jpeg": "30% center",
  "images/Dylan Cassin-2.jpeg": "70% center"
};

function setSlide(el, idx){
  const img = heroImages[idx].img;
  el.style.backgroundImage = `url("${img}")`;
  el.style.backgroundPosition = (window.innerWidth <= 780 && mobilePositionOverrides[img])
    ? mobilePositionOverrides[img] : 'center';
  el.style.animation = 'none';
  void el.offsetWidth; /* force reflow so the restarted animation begins from scale(1) */
  el.style.animation = 'kenburns 5600ms linear forwards';
}
setSlide(slideA, 0);
slideA.classList.add('active');
if (heroImages.length > 1) setSlide(slideB, 1);

const HERO_INTERVAL_MS = 4200;
let heroTimer = null;

function advanceHero(){
  if (heroImages.length < 2) return;
  heroIdx = (heroIdx + 1) % heroImages.length;
  const nextEl = showingA ? slideB : slideA;
  const curEl  = showingA ? slideA : slideB;
  setSlide(nextEl, heroIdx);
  nextEl.classList.add('active');
  curEl.classList.remove('active');
  showingA = !showingA;
}

function startHeroTimer(){
  if (heroTimer) clearInterval(heroTimer);
  heroTimer = setInterval(advanceHero, HERO_INTERVAL_MS);
}
startHeroTimer();

/* home hero images are not clickable — purely a passive slideshow */

/* view switching */
const view = document.getElementById('view');
const gallerySection = document.getElementById('gallery');
const contactSection = document.getElementById('contact');
const gFrameWrap = document.getElementById('gFrameWrap');
const gLayers = gFrameWrap.querySelectorAll('.g-frame');
const gTitle = document.getElementById('gTitle');
const gMeta = document.getElementById('gMeta');

let activeCat=null, activeIdx=0, showingLayer0=true;

function hideAll(){
  homeSection.hidden = true;
  gallerySection.hidden = true;
  contactSection.hidden = true;
}

function openGallery(slug, startId){
  toggleMobile(false);
  view.classList.add('fading');
  setTimeout(()=>{
    const found = categories.find(c=>c.slug===slug);
    activeCat = { ...found }; /* keep items in curated order */
    activeIdx = startId ? Math.max(0, activeCat.items.findIndex(it=>it.id===startId)) : 0;
    hideAll();
    gallerySection.hidden = false;
    document.body.classList.add('nav-black');
    document.querySelectorAll('.nav-links a').forEach(a=>a.classList.toggle('active', a.dataset.slug===slug));
    renderInitial();
    view.classList.remove('fading');
  }, 380);
}

function openContact(){
  toggleMobile(false);
  view.classList.add('fading');
  setTimeout(()=>{
    hideAll();
    contactSection.hidden = false;
    document.body.classList.add('nav-black');
    document.querySelectorAll('.nav-links a').forEach(a=>a.classList.toggle('active', a.dataset.slug==='contact'));
    view.classList.remove('fading');
  }, 380);
}

function goHome(){
  toggleMobile(false);
  if (!gallerySection.hidden || !contactSection.hidden){
    view.classList.add('fading');
    setTimeout(()=>{
      hideAll();
      homeSection.hidden = false;
      document.body.classList.remove('nav-black');
      document.querySelectorAll('.nav-links a').forEach(a=>a.classList.remove('active'));
      view.classList.remove('fading');
    }, 380);
  }
}

function updateMeta(item){
  gTitle.textContent = item.title;
  gMeta.textContent = `${String(activeIdx+1).padStart(2,'0')} / ${String(activeCat.items.length).padStart(2,'0')}`;
}

/* first image of a newly opened category appears straight away, no fade needed */
function renderInitial(){
  const item = activeCat.items[activeIdx];
  gLayers[0].style.backgroundImage = item.img ? `url('${item.img}')` : '';
  gLayers[0].style.backgroundColor = item.img ? '#fff' : '';
  gLayers[0].classList.add('active');
  gLayers[1].classList.remove('active');
  showingLayer0 = true;
  updateMeta(item);
}

/* subsequent images crossfade between the two stacked layers, same as the home hero */
function step(d){
  if (!activeCat) return;
  let newIdx = activeIdx + d;
  if (newIdx >= activeCat.items.length){
    newIdx = 0;
  } else if (newIdx < 0){
    newIdx = activeCat.items.length - 1;
  }
  activeIdx = newIdx;
  const item = activeCat.items[activeIdx];
  const nextLayer = showingLayer0 ? gLayers[1] : gLayers[0];
  const curLayer  = showingLayer0 ? gLayers[0] : gLayers[1];
  nextLayer.style.backgroundImage = item.img ? `url('${item.img}')` : '';
  nextLayer.style.backgroundColor = item.img ? '#fff' : '';
  nextLayer.classList.add('active');
  curLayer.classList.remove('active');
  showingLayer0 = !showingLayer0;
  updateMeta(item);
}

/* left half of the image = previous, right half = next */
gFrameWrap.addEventListener('click', (e)=>{
  e.stopPropagation();
  const rect = gFrameWrap.getBoundingClientRect();
  const clickedLeftHalf = (e.clientX - rect.left) < rect.width / 2;
  step(clickedLeftHalf ? -1 : 1);
});

document.addEventListener('keydown',(e)=>{
  if (!gallerySection.hidden){
    if (e.key==='Escape') goHome();
    if (e.key==='ArrowRight') step(1);
    if (e.key==='ArrowLeft') step(-1);
  } else if (!contactSection.hidden){
    if (e.key==='Escape') goHome();
  } else if (e.key==='Escape' && mobileOpen) toggleMobile(false);
});
</script>
</body>
</html>
